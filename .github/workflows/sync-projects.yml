name: Sync Portfolio Projects

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/sync-projects.yml'
      - 'tools/sync-projects.mjs'

permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync GitHub repositories into portfolio feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ZinSoeTun
        run: node tools/sync-projects.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No portfolio feed changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: sync portfolio projects"
          git push
